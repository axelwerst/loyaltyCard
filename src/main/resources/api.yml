
openapi: 3.0.0
info:
  title: Loyalty Card
  description: API для управления клиентами, картами лояльности, транзакциями и администраторами.
  version: 1.0.0
servers:
  - url: https://api.example.com
    description: Основной сервер

paths:
  /customers:
    post:
      summary: Создать нового клиента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Иван Иванов
                phone:
                  type: string
                  example: +1234567890
                email:
                  type: string
                  example: example@email.com
              required:
                - name
                - phone
                - email
      responses:
        '201':
          description: Клиент успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerID:
                    type: integer
                  message:
                    type: string

  /customers/{customerID}:
    get:
      summary: Получить информацию о клиенте
      parameters:
        - name: customerID
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Информация о клиенте
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerID:
                    type: integer
                  name:
                    type: string
                  phone:
                    type: string
                  email:
                    type: string
    put:
      summary: Обновить данные клиента
      parameters:
        - name: customerID
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
      responses:
        '200':
          description: Клиент обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    delete:
      summary: Удалить клиента
      parameters:
        - name: customerID
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Клиент удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /loyalty-cards:
    post:
      summary: Создать карту лояльности
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerID:
                  type: integer
              required:
                - customerID
      responses:
        '201':
          description: Карта успешно создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardID:
                    type: integer
                  QRCode:
                    type: string
                  message:
                    type: string

  /loyalty-cards/{cardID}:
    get:
      summary: Получить информацию о карте лояльности
      parameters:
        - name: cardID
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Информация о карте лояльности
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardID:
                    type: integer
                  customerID:
                    type: integer
                  QRCode:
                    type: string
                  balance:
                    type: number
                    format: float

  /loyalty-cards/{cardID}/balance:
    put:
      summary: Обновить баланс карты
      parameters:
        - name: cardID
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  format: float
                  example: 100.5
                operation:
                  type: string
                  enum: [add, subtract]
                  example: add
                reason:
                  type: string
                  example: Награда за покупку
      responses:
        '200':
          description: Баланс успешно обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  newBalance:
                    type: number
                    format: float

  /transactions:
    get:
      summary: Получить историю транзакций
      parameters:
        - name: cardID
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: История транзакций
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    transactionID:
                      type: integer
                    cardID:
                      type: integer
                    amount:
                      type: number
                      format: float
                    reason:
                      type: string
                    date:
                      type: string
                      format: date-time

  /admins/login:
    post:
      summary: Авторизация администратора
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Авторизация успешна
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
                    enum: [manager, employee]